<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tenka</title>
    <script>
      // GitHub Pages fallback SPA: path yang tidak ada (mis. /admin-panel, atau
      // redirect OAuth ke sana) dilempar ke index.html app dengan path aslinya
      // dititipkan di ?redirect=..., lalu dipulihkan oleh main.tsx.
      var BASE = "/TENKA-SINEDEOVINDICE/tenka-app/";
      var l = window.location;
      if (l.pathname.indexOf(BASE) === 0) {
        var rest = l.pathname.slice(BASE.length) + l.search + l.hash;
        l.replace(l.origin + BASE + "?redirect=" + encodeURIComponent(rest));
      } else {
        l.replace(BASE);
      }
    </script>
  </head>
  <body></body>
</html>
